<title id="signature-t">Signature</title>
<desc id="signature-d">Think several moves ahead. Ship the one that wins. — Debarshi Sau</desc>
<style>@font-face{font-family:DSSerif;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:DSSerifIt;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:DSMono4;src:url(data:font/woff2;base64,) format('woff2')}text{white-space:pre}.fu{animation:fu 1.3s cubic-bezier(.16,1,.3,1) both}.fi{animation:fi 1.6s cubic-bezier(.16,1,.3,1) both}.rv{transform-box:fill-box;animation:rv 1.5s cubic-bezier(.16,1,.3,1) both}.dl{transform-box:fill-box;transform-origin:0 50%;animation:dl 1.8s cubic-bezier(.65,0,.35,1) both}.dc{transform-box:fill-box;transform-origin:50% 50%;animation:dl 1.8s cubic-bezier(.65,0,.35,1) both}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s cubic-bezier(.16,1,.3,1) infinite}@keyframes fu{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes fi{from{opacity:0}to{opacity:1}}@keyframes rv{from{transform:translateY(110%)}to{transform:none}}@keyframes dl{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes pu{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}.sh{animation:sh 10s cubic-bezier(.65,0,.35,1) 1.8s infinite}@keyframes sh{0%{transform:translateX(-300px) skewX(-18deg)}40%,100%{transform:translateX(1080px) skewX(-18deg)}}.wm{animation:wm 2s cubic-bezier(.16,1,.3,1) .3s both}@keyframes wm{from{transform:translateY(70px);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
<linearGradient id="ft-b" x1="0" y1="0" x2="1000" y2="330" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#D2508F" stop-opacity=".55"/><stop offset=".18" stop-color="rgba(12,12,14,0.20)"/>
<stop offset=".82" stop-color="rgba(12,12,14,0.20)"/><stop offset="1" stop-color="#0F9A8E" stop-opacity=".5"/></linearGradient>
<clipPath id="ft-c"><rect width="1000" height="330" rx="30"/></clipPath>
<radialGradient id="ft-gl"><stop offset="0" stop-color="#6B55E6" stop-opacity="0.12"/><stop offset="1" stop-color="#6B55E6" stop-opacity="0"/></radialGradient>
<linearGradient id="ft-wm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C0C0E" stop-opacity="0.9"/><stop offset="1" stop-color="#0C0C0E" stop-opacity="0"/></linearGradient>
<linearGradient id="ft-sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D2508F" stop-opacity="0"/><stop offset=".3" stop-color="#D2508F"/><stop offset=".5" stop-color="#0F9A8E"/><stop offset=".7" stop-color="#6B55E6"/><stop offset="1" stop-color="#6B55E6" stop-opacity="0"/></linearGradient>
<mask id="ft-m"><text x="500" y="372" text-anchor="middle" textLength="930" lengthAdjust="spacingAndGlyphs" font-family="DSSerif,'Iowan Old Style','Palatino Linotype',Georgia,serif" font-size="196" fill="#fff">Debarshi Sau</text></mask></defs>

<rect width="1000" height="330" rx="30" fill="#F0EEE9"/>
<g clip-path="url(#ft-c)">
  <ellipse cx="500" cy="330" rx="520" ry="200" fill="url(#ft-gl)"/>
  <g class="fi"><path d="M500 49C501.98 56.02 501.98 56.02 509 58C501.98 59.98 501.98 59.98 500 67C498.02 59.98 498.02 59.98 491 58C498.02 56.02 498.02 56.02 500 49Z" fill="#E2461A" /></g>
  <text class="fu" style="animation-delay:.1s" x="500" y="118" text-anchor="middle" font-family="DSSerifIt,'Iowan Old Style','Palatino Linotype',Georgia,serif" font-size="30" font-style="italic" fill="#0C0C0E">Think several moves ahead. Ship the one that wins.</text>
  <text class="fi" style="animation-delay:.5s" x="500" y="152" text-anchor="middle" font-family="DSMono4,ui-monospace,'SF Mono',Consolas,monospace" font-size="9.5" letter-spacing="3" fill="#8A847C">DEBARSHISAU.IN<tspan dx="16" fill="#E2461A">·</tspan><tspan dx="16">© 2026</tspan></text>
  <g class="wm">
    <text x="500" y="372" text-anchor="middle" textLength="930" lengthAdjust="spacingAndGlyphs" font-family="DSSerif,'Iowan Old Style','Palatino Linotype',Georgia,serif" font-size="196" fill="url(#ft-wm)">Debarshi Sau</text>
    <g mask="url(#ft-m)"><rect class="sh" x="0" y="140" width="260" height="330" fill="url(#ft-sh)" opacity="0.8"/></g>
  </g>
</g>
<rect x=".5" y=".5" width="999" height="329" rx="29.5" stroke="url(#ft-b)"/>
</svg>
