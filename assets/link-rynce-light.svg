<style>@font-face{font-family:DSSans5;src:url(data:font/woff2;base64,) format('woff2')}text{white-space:pre}.fu{animation:fu 1.3s cubic-bezier(.16,1,.3,1) both}.fi{animation:fi 1.6s cubic-bezier(.16,1,.3,1) both}.rv{transform-box:fill-box;animation:rv 1.5s cubic-bezier(.16,1,.3,1) both}.dl{transform-box:fill-box;transform-origin:0 50%;animation:dl 1.8s cubic-bezier(.65,0,.35,1) both}.dc{transform-box:fill-box;transform-origin:50% 50%;animation:dl 1.8s cubic-bezier(.65,0,.35,1) both}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s cubic-bezier(.16,1,.3,1) infinite}@keyframes fu{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes fi{from{opacity:0}to{opacity:1}}@keyframes rv{from{transform:translateY(110%)}to{transform:none}}@keyframes dl{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes pu{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}.s{animation:s 7s cubic-bezier(.65,0,.35,1) 1.8s infinite}@keyframes s{0%{transform:translateX(-110px) skewX(-20deg)}35%,100%{transform:translateX(276px) skewX(-20deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
